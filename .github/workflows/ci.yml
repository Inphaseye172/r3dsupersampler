name: CI

on:
  push:
    branches: ["**"]
    # v*: production release (gated). dev-*: developer pre-release (no gate, clearly labelled).
    tags: ["v*", "dev-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: "Also build the CUDA resampler on Windows (slow toolkit install). Never published: no GPU runner tests it."
        type: boolean
        default: false
      prerelease_tag:
        description: "Publish a developer pre-release under this new tag (must start with dev-); empty = no release"
        type: string
        default: ""

env:
  # Private: a direct-download URL for the RED R3D SDK zip and a bearer token for it. The SDK is
  # proprietary and never committed. When unset, the SDK module builds as "unavailable" and the
  # SDK tests skip.
  R3DSDK_ZIP_URL: ${{ secrets.R3DSDK_ZIP_URL }}
  R3DSDK_TOKEN: ${{ secrets.R3DSDK_TOKEN }}
  # The independent pixel + tag gate (scripts/verify_cdng.py); tifffile also writes the matrix's
  # third-party source. Pinned so a tool update cannot change what "passed" means.
  GATE_TOOLS: rawpy==0.27.1 numpy==2.5.4 tifffile==2026.9.20

jobs:
  linux:
    name: Linux (engine, CLI, GUI, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build catch2 nlohmann-json3-dev libcli11-dev qt6-base-dev libgl1-mesa-dev
          python -m pip install --quiet $GATE_TOOLS
      - name: Fetch RED R3D SDK (private, optional)
        if: env.R3DSDK_ZIP_URL != ''
        # Never fails the job: a missing or unreachable SDK means "build without it" (docs/IMPLEMENTATION_PLAN.md).
        run: |
          mkdir -p .deps/r3dsdk
          if ! curl -fsSL --retry 2 -H "Authorization: Bearer $R3DSDK_TOKEN" -o .deps/r3dsdk.zip "$R3DSDK_ZIP_URL"; then
            echo "::warning title=RED R3D SDK::download failed (HTTP error or bad R3DSDK_ZIP_URL); building without the SDK"
            exit 0
          fi
          if ! unzip -q .deps/r3dsdk.zip -d .deps/r3dsdk; then
            echo "::warning title=RED R3D SDK::archive could not be unzipped; building without the SDK"
            exit 0
          fi
          hdr=$(find .deps/r3dsdk -name R3DSDK.h -path '*Include*' | head -1)
          if [ -z "$hdr" ]; then
            echo "::warning title=RED R3D SDK::R3DSDK.h not found in the archive; building without the SDK"
            exit 0
          fi
          root=$(cd "$(dirname "$hdr")/.." && pwd)
          echo "R3DSDK_ROOT=$root" >> "$GITHUB_ENV"
          echo "RED R3D SDK unpacked at $root"
      - name: Cache sample clips
        uses: actions/cache@v4
        with:
          path: .deps/samples
          key: samples-v1
      - name: Fetch sample clips
        run: |
          python scripts/fetch_samples.py
          echo "R3DSS_SAMPLES=$PWD/.deps/samples" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset linux-ci
      - name: Build
        run: cmake --build --preset linux-ci -j"$(nproc)"
      - name: Test
        run: ctest --preset linux-ci
      - name: CLI end-to-end
        run: |
          set -euo pipefail
          cli=./build/linux-ci/src/cli/r3dss-cli
          $cli codecs
          $cli synth /tmp/synth --width 1920 --height 1080 --frames 8 --audio-channels 2
          $cli convert /tmp/synth -o /tmp/out --size 960x540
          $cli probe /tmp/out/synth_960x540_lossless > /tmp/probe.json
          python - <<'PY'
          import json
          j = json.load(open("/tmp/probe.json"))
          assert (j["format"], j["width"], j["height"], j["frames"]) == ("CinemaDNG", 960, 540, 8), j
          print("e2e ok:", j["width"], "x", j["height"], j["frames"], "frames")
          PY
      - name: Probe sample clip (container, no SDK needed)
        run: |
          ./build/linux-ci/src/cli/r3dss-cli probe --chunks "$R3DSS_SAMPLES/A060_A027_0912VZ_001.R3D" > probe-komodo.json
          python - <<'PY'
          import json
          j = json.load(open("probe-komodo.json"))
          assert j["source"] == "REDCODE RAW (KOMODO 6K)", j["source"]
          assert len(j["chunks"]) == 98, len(j["chunks"])
          assert j["chunkHistogram"]["RDI"]["count"] == 84
          print("probe ok:", j["source"], len(j["chunks"]), "chunks")
          PY
      - name: GUI smoke (offscreen)
        run: QT_QPA_PLATFORM=offscreen ./build/linux-ci/src/gui/r3dss-gui --smoke
      - name: Acceptance from the installed tree (RAW-to-RAW matrix, independent LibRaw gate)
        run: |
          cmake --install build/linux-ci --prefix dist-linux
          python scripts/acceptance.py --bin dist-linux/bin --mode dev --require-independent --report acceptance-linux.json
      - name: Benchmark (small)
        run: ./build/linux-ci/bench/r3dss-bench --width 3840 --height 2160 --frames 4 --size FHD --json bench-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux
          path: |
            bench-linux.json
            probe-komodo.json
            acceptance-linux.json
          if-no-files-found: ignore

  windows:
    name: Windows x64 (MSVC, vcpkg, Qt, installer)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.deps\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.deps\vcpkg-cache
      # Tags v* build a production release: CMake refuses to configure unless every advertised
      # capability (release/capabilities.json), the verified samples and the maintainer's third-party
      # terms acknowledgement (repository variable R3DSS_THIRD_PARTY_TERMS_ACKNOWLEDGED=ON) are present.
      R3DSS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
      R3DSS_TERMS_ACK: ${{ vars.R3DSS_THIRD_PARTY_TERMS_ACKNOWLEDGED || 'OFF' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RED R3D SDK (private, optional)
        if: env.R3DSDK_ZIP_URL != ''
        shell: pwsh
        # Never fails the job: a missing or unreachable SDK means "build without it".
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .deps\r3dsdk | Out-Null
          try {
            Invoke-WebRequest -Uri $env:R3DSDK_ZIP_URL -Headers @{ Authorization = "Bearer $env:R3DSDK_TOKEN" } -OutFile .deps\r3dsdk.zip
            Expand-Archive -Path .deps\r3dsdk.zip -DestinationPath .deps\r3dsdk -Force
          } catch {
            Write-Host "::warning title=RED R3D SDK::download or unzip failed ($($_.Exception.Message)); building without the SDK"
            exit 0
          }
          $hdr = Get-ChildItem -Recurse .deps\r3dsdk -Filter R3DSDK.h | Where-Object { $_.DirectoryName -like "*Include*" } | Select-Object -First 1
          if (-not $hdr) {
            Write-Host "::warning title=RED R3D SDK::R3DSDK.h not found in the archive; building without the SDK"
            exit 0
          }
          $root = (Resolve-Path (Join-Path $hdr.DirectoryName "..")).Path
          "R3DSDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RED R3D SDK unpacked at $root"
      - name: Cache sample clips
        uses: actions/cache@v4
        with:
          path: .deps\samples
          key: samples-v1
      - name: Fetch sample clips and gate tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          python scripts/fetch_samples.py
          "R3DSS_SAMPLES=$env:GITHUB_WORKSPACE\.deps\samples" | Out-File -FilePath $env:GITHUB_ENV -Append
          $tools = $env:GATE_TOOLS -split " "
          python -m pip install --quiet @tools
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .deps\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force .deps\vcpkg-cache | Out-Null
          git clone https://github.com/microsoft/vcpkg .deps\vcpkg
          git -C .deps\vcpkg checkout 2026.07.29
          & .deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          choco install ninja -y --no-progress
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
      - name: CUDA toolkit (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $env:QT_ROOT = $env:QT_ROOT_DIR
          $env:VCPKG_ROOT = "$env:GITHUB_WORKSPACE\.deps\vcpkg"
          cmake --preset windows-release -DR3DSS_RELEASE="$env:R3DSS_RELEASE" -DR3DSS_THIRD_PARTY_TERMS_ACKNOWLEDGED="$env:R3DSS_TERMS_ACK"
      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release
      - name: Test
        shell: pwsh
        run: ctest --preset windows-release
      - name: CLI end-to-end
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $cli = ".\build\windows-release\src\cli\r3dss-cli.exe"
          & $cli synth $env:TEMP\synth --width 1920 --height 1080 --frames 8 --audio-channels 2
          & $cli convert $env:TEMP\synth -o $env:TEMP\out --size 960x540
          $j = & $cli probe $env:TEMP\out\synth_960x540_lossless | ConvertFrom-Json
          if ($j.format -ne "CinemaDNG" -or $j.width -ne 960 -or $j.height -ne 540 -or $j.frames -ne 8) { throw "unexpected output: $($j | ConvertTo-Json -Compress)" }
      - name: Install + package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build\windows-release --prefix dist
          # Everything the package needs at runtime, including the app-local MSVC runtime.
          $required = @("bin\r3dss-cli.exe", "bin\r3dss-gui.exe", "bin\Qt6Core.dll", "bin\Qt6Gui.dll", "bin\Qt6Widgets.dll",
                        "bin\platforms\qwindows.dll", "bin\vcruntime140.dll", "bin\vcruntime140_1.dll", "bin\msvcp140.dll",
                        "licenses\LGPL-3.0-only.txt", "licenses\GPL-3.0-only.txt", "licenses\nlohmann-json.txt", "licenses\cli11.txt",
                        "LICENSE", "NOTICE")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path dist $_)) }
          if ($missing) { throw "package is missing: $($missing -join ', ')" }
          if (Test-Path dist\bin\vc_redist.x64.exe) { throw "vc_redist.x64.exe must not be shipped (the runtime is app-local)" }
          Compress-Archive -Path dist\* -DestinationPath r3dss-win64.zip -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSourceDir="$PWD\dist" /DAppVersion="0.3.0" installer\r3dss.iss
      - name: Every import of the package resolves inside it or to Windows itself
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Runtime DLLs that a clean Windows does not have, although this runner does in System32.
          $notOs = '^(vcruntime|msvcp|concrt|vccorlib|vcomp|qt6|cudart)'
          $local = @{}
          Get-ChildItem dist\bin -Recurse -Include *.dll, *.exe | ForEach-Object { $local[$_.Name.ToLower()] = $true }
          $problems = @()
          foreach ($f in Get-ChildItem dist\bin -Recurse -Include *.dll, *.exe) {
            $deps = (dumpbin /nologo /dependents $f.FullName) | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLower() }
            foreach ($d in $deps) {
              if ($local.ContainsKey($d)) { continue }
              if ($d -match '^(api|ext)-ms-win-') { continue }
              if (($d -notmatch $notOs) -and (Test-Path (Join-Path $env:WINDIR "System32\$d"))) { continue }
              $problems += "$($f.Name) imports $d, which is not in the package"
            }
          }
          if ($problems) { $problems | ForEach-Object { Write-Host $_ }; throw "$($problems.Count) unresolved imports" }
          Write-Host "all imports resolve"
      - name: Installed acceptance (silent install, then run from the installed location)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          $dir = "C:\r3dss-accept"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$dir\bin\r3dss-cli.exe")) { throw "installed r3dss-cli.exe missing" }
          $mode = if ($env:R3DSS_RELEASE -eq "ON") { "release" } else { "dev" }
          python scripts/acceptance.py --bin "$dir\bin" --mode $mode --require-independent --report acceptance-windows.json
          # The installed GUI: the headless batch runner (same engine path as the window), then a window smoke.
          $work = "$env:TEMP\gui-job"
          & "$dir\bin\r3dss-cli.exe" synth "$work\in\G001" --width 1920 --height 1080 --frames 4 --audio-channels 2
          & "$dir\bin\r3dss-cli.exe" scan "$work\in" -o "$work\out" --size 960x540 --write-job "$work\job.json"
          $g = Start-Process -FilePath "$dir\bin\r3dss-gui.exe" -ArgumentList "--run-job", "`"$work\job.json`"" -Wait -PassThru -RedirectStandardOutput "$work\gui.txt"
          Get-Content "$work\gui.txt"
          if ($g.ExitCode -ne 0) { throw "r3dss-gui --run-job exited $($g.ExitCode)" }
          if (-not (Test-Path "$work\out\G001_960x540_lossless\G001_960x540_lossless_000003.dng")) { throw "--run-job wrote no output" }
          $s = Start-Process -FilePath "$dir\bin\r3dss-gui.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "installed r3dss-gui --smoke exited $($s.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-windows
          path: acceptance-windows.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: r3dss-win64-portable
          path: r3dss-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: r3dss-win64-installer
          path: installer\Output\*.exe

  # Publishing waits for BOTH platforms. CUDA builds are never published: no GPU runner tests them.
  release:
    name: Publish GitHub release
    needs: [linux, windows]
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev-') || startsWith(inputs.prerelease_tag, 'dev-')) && !inputs.cuda }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The pushed v* / dev-* tag, or a dev-* tag given to a manual run (the release creates that tag at
      # this run's commit).
      R3DSS_PUBLISH_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev-')) && github.ref_name || inputs.prerelease_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: rel
          pattern: "{r3dss-win64-portable,r3dss-win64-installer,acceptance-windows,bench-linux}"
          merge-multiple: true
      - name: Release notes and checksums
        run: |
          set -euo pipefail
          cd rel
          sha256sum r3dss-win64.zip r3dss-*-setup.exe > SHA256SUMS.txt
          cd ..
          if [[ "$R3DSS_PUBLISH_TAG" == dev-* ]]; then
            sed -e "s/{{COMMIT}}/$GITHUB_SHA/g" -e "s/{{TAG}}/$R3DSS_PUBLISH_TAG/g" release/DEV_RELEASE_NOTES.md > release-notes.md
          else
            echo "Release $R3DSS_PUBLISH_TAG from commit $GITHUB_SHA, built with the production release gate (release/capabilities.json)." > release-notes.md
          fi
          { echo; echo "## SHA-256"; echo; echo '```text'; cat rel/SHA256SUMS.txt; echo '```'; } >> release-notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.R3DSS_PUBLISH_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(env.R3DSS_PUBLISH_TAG, 'dev-') && format('r3dss developer build {0}', env.R3DSS_PUBLISH_TAG) || format('r3dss {0}', env.R3DSS_PUBLISH_TAG) }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.R3DSS_PUBLISH_TAG, 'dev-') }}
          make_latest: ${{ startsWith(env.R3DSS_PUBLISH_TAG, 'dev-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            rel/r3dss-win64.zip
            rel/r3dss-*-setup.exe
            rel/SHA256SUMS.txt
            rel/acceptance-windows.json
            rel/acceptance-linux.json
